server.port=${PORT:8080}

# Apache Derby Database Configuration (Embedded In-Memory)
spring.datasource.url=jdbc:derby:memory:projectmgmt;create=true
spring.datasource.driverClassName=org.apache.derby.jdbc.EmbeddedDriver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration for Derby
spring.jpa.database-platform=org.hibernate.dialect.DerbyDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Initialize SQL script after tables are created by JPA
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Swagger / OpenAPI Paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

