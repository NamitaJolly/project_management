server.port=${PORT:8080}

# Database Configuration (Defaults to embedded Derby, or Cloud PostgreSQL / MySQL via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:derby:./derbydb;create=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable raw SQL script execution (handled cleanly by DataInitializer)
spring.sql.init.mode=never

# Swagger / OpenAPI Paths
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

